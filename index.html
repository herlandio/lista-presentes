
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Lista de Presentes</title>

    <meta name="description" content="Confira minha lista de presentes de aniversário.">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="hero">
        <div class="container text-center">
            <span class="hero-label">UM DIA ESPECIAL</span>

            <h1 id="birthday-title">Minha lista de presentes</h1>

            <p id="birthday-message" class="hero-message">
                Sua presença já é um presente!
            </p>

            <div class="birthday-date" id="birthday-date">
                Meu aniversário
            </div>

            <div class="hero-actions mt-4">
                <button id="share-button" class="btn-share">
                    <span>↗</span> Compartilhar lista
                </button>

                <button id="copy-button" class="btn-copy">
                    Copiar link
                </button>
            </div>

            <small id="copy-feedback" class="copy-feedback"></small>
        </div>
    </header>

    <main class="container py-5">

        <section class="text-center mb-5">
            <h2>Escolha um presente</h2>

            <p class="section-description">
                Preparei algumas sugestões com muito carinho.
                Fique à vontade para escolher!
            </p>
        </section>

        <section>
            <div id="gifts-container" class="row g-4">
                <div class="col-12 text-center">
                    Carregando presentes...
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p>Feito com carinho ❤️</p>
        </div>
    </footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/reservations.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
