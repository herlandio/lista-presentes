
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">

    <title>Convite - Sophia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #090909;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            max-height: 90vh;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.82);
            opacity: 0;
            visibility: hidden;
            transition: .4s;
        }

        .video-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .video-overlay p {
            color: white;
            font-size: 22px;
        }

        .gift-link {
            padding: 15px 25px;
            border-radius: 30px;
            background: linear-gradient(135deg, #fff, #c9c9c9);
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .replay {
            padding: 10px 18px;
            border: 1px solid white;
            border-radius: 25px;
            color: white;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main class="video-container">

        <video id="invitation-video" controls playsinline preload="metadata">
            <source
                src="assets/video/convite-sophia.mp4"
                type="video/mp4"
            >
            Seu navegador não suporta vídeos.
        </video>

        <div id="video-overlay" class="video-overlay">

            <p>Preparamos tudo com muito carinho! ❤️</p>

            <a
                href="./index.html"
                class="gift-link"
            >
                Acessar lista de presença ↗
            </a>

            <button id="replay-button" class="replay">
                Assistir novamente
            </button>

        </div>

    </main>

    <script>
        const video = document.getElementById('invitation-video');
        const overlay = document.getElementById('video-overlay');
        const replay = document.getElementById('replay-button');

        video.addEventListener('ended', () => {
            overlay.classList.add('show');
        });

        replay.addEventListener('click', () => {
            overlay.classList.remove('show');
            video.currentTime = 0;
            video.play();
        });

        video.addEventListener('play', () => {
            overlay.classList.remove('show');
        });
    </script>

</body>
</html>
